<!DOCTYPE html>
<>

<>
    <title>Mi página</title>

    <style>
        body {
            background-color: #111827;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
        }

        h1 {
            font-size: 60px;
        }

        p {
            font-size: 18px;
        }

        button {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            font-size: 16px;
          cursor: pointer;
          transition: 0.3s;
        }
      button:hover {
        background-color: #1d4ed8;
        
      }
  .card {
    background-color: #1f2937;
    padding: 30px;
    border-radius: 15px;
    max-width: 400px;
    margin: auto;
  }
      
    #cuadrado {
    width: 60px;
    height: 60px;
    background-color: red;
    margin: 100px auto;
}

#cuadrado.saltando {
    animation: salto 0.5s ease;
}

@keyframes salto {
    0% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-120px);
    }

    100% {
        transform: translateY(0);
    }
}
  
</style>

</head>

<body>
  

    <div class="card">

        <h1>Hola, soy Pedro</h1>

        <p>Estoy aprendiendo desarrollo web.</p>

        <button>Contactarme</button>
      
<div id="cuadrado"></div>
    </div>
  
  <script>
    const cuadrado = document.getElementById("cuadrado");

    cuadrado.addEventListener("click", function() {
        cuadrado.classList.remove("saltando");

        void cuadrado.offsetWidth;

        cuadrado.classList.add("saltando");
    });
</script>

</body>

</html>
